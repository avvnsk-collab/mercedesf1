name: Build Mercedes F1 Watchface

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install asset dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Install Zepp toolchain
        run: npm install

      - name: Generate assets
        run: npm run assets

      - name: Capture zpm diagnostics once
        shell: bash
        run: |
          if [ ! -f diagnostics/zpm_help.txt ]; then
            mkdir -p diagnostics
            (npx zpm --help || true) > diagnostics/zpm_help.txt 2>&1
            (npx zpm build --help || true) > diagnostics/zpm_build_help.txt 2>&1
            find node_modules/@zeppos/zpm -type f | sort > diagnostics/zpm_files.txt
            grep -R -n -C 8 "resolveTarget" node_modules/@zeppos/zpm > diagnostics/resolve_target.txt || true
            git config user.name github-actions
            git config user.email github-actions@github.com
            git add diagnostics
            git commit -m "Add temporary zpm diagnostics"
            git push
          fi

      - name: Build watchface
        run: npx zpm build -p "$GITHUB_WORKSPACE"

      - name: Collect package
        shell: bash
        run: |
          mkdir -p dist
          find . -type f \( -name '*.zab' -o -name '*.zpk' \) -print -exec cp {} dist/ \;
          if [ -z "$(ls -A dist)" ]; then
            echo 'No watchface package was produced.'
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

      - name: Upload watchface
        uses: actions/upload-artifact@v4
        with:
          name: mercedes-f1-balance2
          path: dist/*
          if-no-files-found: error
